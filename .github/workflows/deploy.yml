name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Verify calculations
        run: npm run verify:calculations

      - name: Build
        run: npm run build

      - name: Verify generated SEO output
        run: npm run verify:seo

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for legacy branch Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=20" --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment")] | first | .status // "missing"')"
          if [ "$status" = "missing" ]; then
            echo "No legacy branch deployment found; continuing."
            exit 0
          fi

          for attempt in {1..36}; do
            if [ "$status" = "completed" ]; then
              echo "Legacy branch deployment completed; publishing the Vite artifact last."
              exit 0
            fi
            sleep 5
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=20" --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment")] | first | .status // "missing"')"
          done

          echo "Timed out waiting for the legacy Pages deployment."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
